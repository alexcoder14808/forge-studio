<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forge Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="logo">F</span><div><b>Forge Studio</b><small>Visual app & website builder</small></div></div>
      <input id="projectName" class="project-name" value="My Project" aria-label="Project name">
      <div class="top-actions">
        <button id="undoBtn">↶</button><button id="redoBtn">↷</button>
        <button id="previewBtn">Preview</button><button id="exportBtn" class="primary">Export</button>
      </div>
    </header>

    <div class="studio">
      <aside class="panel left">
        <div class="panel-head"><b>Build</b><button id="addPageBtn">＋ Page</button></div>
        <div id="pages" class="pages"></div>
        <div class="panel-head"><b>Elements</b></div>
        <input id="search" class="search" placeholder="Search elements">
        <div id="palette" class="palette"></div>
      </aside>

      <main class="canvas-wrap">
        <div class="toolbar">
          <div class="device"><button class="active" data-device="desktop">Desktop</button><button data-device="tablet">Tablet</button><button data-device="mobile">Mobile</button></div>
          <div><button id="zoomOut">−</button><span id="zoom">100%</span><button id="zoomIn">＋</button></div>
        </div>
        <div id="stage" class="stage"><div id="canvas" class="canvas"></div></div>
      </main>

      <aside class="panel right">
        <div class="panel-head"><b>Inspector</b></div>
        <div id="inspector" class="inspector"></div>
      </aside>
    </div>
  </div>

  <div id="preview" class="modal hidden">
    <div class="modal-card"><div class="modal-head"><b>Preview</b><button data-close>×</button></div><iframe id="previewFrame"></iframe></div>
  </div>

  <div id="export" class="modal hidden">
    <div class="modal-card export-card"><div class="modal-head"><b>Export project</b><button data-close>×</button></div>
      <p>Download a static project containing your pages, styling and interactions.</p>
      <button id="downloadProject" class="primary wide">Download ZIP</button>
      <button id="downloadJSON" class="wide">Download project JSON</button>
    </div>
  </div>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
